name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ordr
          POSTGRES_PASSWORD: ordr
          POSTGRES_DB: ordr
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ordr -d ordr"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://ordr:ordr@localhost:5432/ordr_test
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: test-access-secret-key-32bytes
      JWT_REFRESH_SECRET: test-refresh-secret-key-32b
      APP_URL: http://localhost:3000
      WEB_ORIGIN: http://localhost:3000
      API_INTERNAL_URL: http://127.0.0.1:4000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Create test database
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          PGPASSWORD=ordr psql -h 127.0.0.1 -U ordr -d ordr -c "CREATE DATABASE ordr_test"
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - name: Install Playwright
        run: pnpm exec playwright install --with-deps chromium
      - name: End-to-end
        run: pnpm test:e2e
        env:
          DATABASE_URL: postgresql://ordr:ordr@localhost:5432/ordr
          CI: "true"
